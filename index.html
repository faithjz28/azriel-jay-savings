<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f6f8">
<title>Azriel Jay Savings</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f5f6f8;color:#17191e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:28px 18px 110px} h1{font-size:34px;margin:18px 0 28px}
.card{background:#fff;border:1px solid #e1e3e8;border-radius:25px;padding:22px;margin:14px 0}
.label,.meta{color:#7b818c}.big{font-size:45px;font-weight:800;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.value{font-size:25px;font-weight:750;margin-top:9px}.green{color:#32825e}.red{color:#a6534e}
input,select,textarea,button{font:inherit;width:100%;padding:14px;border:1px solid #d9dce1;border-radius:13px;background:#fff;margin:6px 0}
button.primary{background:#17191e;color:#fff;font-weight:700}.tx{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid #e1e3e8}
.tx:last-child{border-bottom:0}.name,.amt{font-size:18px;font-weight:700}.empty{text-align:center;color:#7b818c;padding:20px}
.view{display:none}.view.active{display:block} #app{display:none} #login{max-width:480px;margin:55px auto}.error{color:#a6534e;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:none;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:3}
nav button{border:0;color:#7b818c;margin:0;border-radius:0}nav button.active{font-weight:750;color:#17191e}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><main>
<section id="login"><h1>Azriel Jay Savings</h1><div class="card"><h2>Private sign in</h2><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="signin" class="primary">Sign in</button><button id="forgot" type="button">Forgot password?</button><div id="loginMsg" class="error"></div><div id="resetCard" style="display:none"><h2>Create new password</h2><input id="newPassword" type="password" placeholder="New password"><input id="confirmPassword" type="password" placeholder="Confirm new password"><button id="savePassword" class="primary" type="button">Save new password</button><div id="resetMsg" class="error"></div></div></div></section>
<div id="app">
<section id="home" class="view active"><h1>Azriel Jay Savings</h1><div class="card"><div class="label">Current savings</div><div class="big" id="bal">$0.00</div><div class="label">Net change: <span id="net">$0.00</span></div></div><div class="grid"><div class="card"><div class="label">Money in</div><div id="mi" class="value green">$0.00</div></div><div class="card"><div class="label">Money out</div><div id="mo" class="value red">$0.00</div></div></div><h2>Recent transactions</h2><div class="card" id="recent"><div class="empty">No transactions yet.</div></div><button id="logout">Sign out</button></section>
<section id="transactions" class="view"><h1>Transactions</h1><div class="card"><form id="form"><select id="typ"><option>Money In</option><option>Money Out</option></select><input id="amt" type="number" min="0" step=".01" placeholder="Amount" required><input id="des" placeholder="Description" required><input id="cat" placeholder="Category (optional)"><input id="dat" type="date" required><textarea id="notes" placeholder="Notes (optional)"></textarea><button class="primary">Add Transaction</button></form></div><div class="card" id="all"><div class="empty">No transactions yet.</div></div></section>
<section id="monthly" class="view"><h1>Monthly</h1><div class="card"><input id="mp" type="month"><div id="ms"></div></div></section>
<section id="yearly" class="view"><h1>Yearly</h1><div class="card"><input id="yp" type="number" min="2000" max="2100"><div id="ys"></div></div></section>
</div></main>
<nav id="nav"><button class="active" data-v="home">Home</button><button data-v="transactions">Transactions</button><button data-v="monthly">Monthly</button><button data-v="yearly">Yearly</button></nav>
<script>
const sb=supabase.createClient("https://nscgbqeyyninunvhlkas.supabase.co","sb_publishable_noeKmKCYmGqETcdSSlPxRw_T9NdIAD_");let T=[],user=null;
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD"}).format(n);
function totals(a=T){let i=0,o=0;a.forEach(x=>x.transaction_type==="Money In"?i+=Number(x.amount):o+=Number(x.amount));return{i,o,n:i-o}}
function txrow(x){return `<div class="tx"><div><div class="name">${x.description}</div><div class="meta">${x.transaction_date}${x.category?" · "+x.category:""}</div></div><div class="amt ${x.transaction_type==="Money In"?"green":"red"}">${x.transaction_type==="Money In"?"+":"−"}${money(Number(x.amount))}</div></div>`}
function summary(t){return `<h2>Summary</h2><div class="label">Money in</div><div class="value green">${money(t.i)}</div><br><div class="label">Money out</div><div class="value red">${money(t.o)}</div><br><div class="label">Net change</div><div class="value">${money(t.n)}</div>`}
function render(){let t=totals(),s=[...T].sort((a,b)=>b.transaction_date.localeCompare(a.transaction_date));$("bal").textContent=money(t.n);$("net").textContent=money(t.n);$("mi").textContent=money(t.i);$("mo").textContent=money(t.o);$("recent").innerHTML=s.length?s.slice(0,5).map(txrow).join(""):'<div class="empty">No transactions yet.</div>';$("all").innerHTML=s.length?s.map(txrow).join(""):'<div class="empty">No transactions yet.</div>';renderMonth();renderYear()}
async function load(){let r=await sb.from("transactions").select("*").order("transaction_date",{ascending:false});if(r.error){alert(r.error.message);return}T=r.data||[];render()}
$("signin").onclick=async()=>{$("loginMsg").textContent="";let r=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(r.error){$("loginMsg").textContent=r.error.message;return}user=r.data.user;$("login").style.display="none";$("app").style.display="block";$("nav").style.display="grid";await load()}
$("forgot").onclick=async()=>{let e=$("email").value.trim();$("loginMsg").textContent="";if(!e){$("loginMsg").textContent="Enter your email first.";return}let r=await sb.auth.resetPasswordForEmail(e,{redirectTo:"https://faithjz28.github.io/azriel-jay-savings/"});$("loginMsg").textContent=r.error?r.error.message:"Password reset email sent. Check your inbox."}
function showReset(){$("resetCard").style.display="block"}
sb.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY"){showReset();return;}});
$("savePassword").onclick=async()=>{let p=$("newPassword").value,c=$("confirmPassword").value;$("resetMsg").textContent="";if(p.length<6){$("resetMsg").textContent="Password must be at least 6 characters.";return}if(p!==c){$("resetMsg").textContent="Passwords do not match.";return}let r=await sb.auth.updateUser({password:p});if(r.error){$("resetMsg").textContent=r.error.message;return}$("resetMsg").style.color="#32825e";$("resetMsg").textContent="Password changed. Sign in with your new password.";setTimeout(async()=>{await sb.auth.signOut();location.href="https://faithjz28.github.io/azriel-jay-savings/"},1500)}
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()}
$("form").onsubmit=async e=>{e.preventDefault();let r=await sb.from("transactions").insert({user_id:user.id,transaction_date:$("dat").value,description:$("des").value,transaction_type:$("typ").value,amount:Number($("amt").value),category:$("cat").value||null,notes:$("notes").value||null});if(r.error){alert(r.error.message);return}$("form").reset();$("dat").value=new Date().toISOString().slice(0,10);await load()}
function renderMonth(){$("ms").innerHTML=summary(totals(T.filter(x=>x.transaction_date.startsWith($("mp").value))))}
function renderYear(){$("ys").innerHTML=summary(totals(T.filter(x=>x.transaction_date.startsWith($("yp").value+"-"))))}
let d=new Date();$("dat").value=d.toISOString().slice(0,10);$("mp").value=d.toISOString().slice(0,7);$("yp").value=d.getFullYear();$("mp").onchange=renderMonth;$("yp").oninput=renderYear;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button,.view").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.v).classList.add("active")});
(async()=>{let s=await sb.auth.getSession();if(s.data.session){user=s.data.session.user;$("login").style.display="none";$("app").style.display="block";$("nav").style.display="grid";await load()}})();
</script></body></html>
